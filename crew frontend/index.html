<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crew Management System</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            color: #1e293b;
        }

        header {
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-top: 8px;
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .full-width {
            grid-column: span 2;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            margin-top: 15px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .refresh-btn {
            background: #059669;
            color: white;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: bold;
        }

        @media(max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .container {
                width: 95%;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>✈ Crew Management System</h1>
    <p>Manage Flight Crew Details Easily</p>
</header>

<div class="container">

    <!-- ADD CREW FORM -->
    <div class="card">

        <h2>Add Crew Member</h2>

        <div class="form-grid">

            <input type="text" id="crewName"
                   placeholder="Enter Crew Name">

            <input type="date" id="dob">

            <input type="text" id="passportNumber"
                   placeholder="Enter Passport Number">

            <input type="date" id="passportExpiryDate">

            <input type="text" id="flightNumberAssigned"
                   placeholder="Flight Number">

            <input type="text" id="originAirport"
                   placeholder="Origin Airport">

            <input type="text" id="destinationAirport"
                   placeholder="Destination Airport">

            <select id="journeyStatus">
                <option value="">Select Journey Status</option>
                <option value="Scheduled">Scheduled</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>

        </div>

        <button class="add-btn" id="addCrew">
            + Add Crew Member
        </button>

    </div>


    <!-- DISPLAY CREW -->
    <div class="card">

        <h2>Crew Members</h2>

        <button class="refresh-btn" id="loadCrew">
            Refresh Data
        </button>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>DOB</th>
                <th>Passport</th>
                <th>Expiry</th>
                <th>Flight</th>
                <th>Origin</th>
                <th>Destination</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="crewTableBody">

            </tbody>

        </table>

    </div>

</div>


<script>

    // LOAD ALL CREW MEMBERS
    function loadCrew() {

        $.ajax({
            url: "http://localhost:8080/crew/getallcrews",
            type: "GET",

            success: function(data) {

                $("#crewTableBody").empty();

                $.each(data, function(index, crew) {

                    let row = `
                        <tr>
                            <td>${crew.crewId}</td>
                            <td>${crew.crewName}</td>
                            <td>${crew.dob}</td>
                            <td>${crew.passportNumber}</td>
                            <td>${crew.passportExpiryDate}</td>
                            <td>${crew.flightNumberAssigned}</td>
                            <td>${crew.originAirport}</td>
                            <td>${crew.destinationAirport}</td>
                            <td>
                                <span class="status">
                                    ${crew.journeyStatus}
                                </span>
                            </td>

                            <td>
                                <button class="delete-btn"
                                    onclick="deleteCrew(${crew.crewId})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;

                    $("#crewTableBody").append(row);

                });
            },

            error: function() {
                alert("Error loading crew data!");
            }
        });

    }


    // ADD CREW
    $("#addCrew").click(function() {

        let crewData = {

            crewName: $("#crewName").val(),

            dob: $("#dob").val(),

            passportNumber: $("#passportNumber").val(),

            passportExpiryDate:
                $("#passportExpiryDate").val(),

            flightNumberAssigned:
                $("#flightNumberAssigned").val(),

            originAirport:
                $("#originAirport").val(),

            destinationAirport:
                $("#destinationAirport").val(),

            journeyStatus:
                $("#journeyStatus").val()
        };


        $.ajax({

            url: "http://localhost:8080/crew/addcrew",

            type: "POST",

            contentType: "application/json",

            data: JSON.stringify(crewData),

            success: function(response) {

                alert("Crew Member Added Successfully!");

                // Clear form
                $("input").val("");
                $("#journeyStatus").val("");

                // Reload table
                loadCrew();
            },

            error: function() {
                alert("Error adding crew member!");
            }

        });

    });


    // DELETE CREW
    function deleteCrew(id) {

        if (confirm("Are you sure you want to delete this crew member?")) {

            $.ajax({

                url: "http://localhost:8080/crew/" + id,

                type: "DELETE",

                success: function() {

                    alert("Crew deleted successfully!");

                    loadCrew();
                },

                error: function() {
                    alert("Error deleting crew!");
                }

            });

        }

    }


    // REFRESH BUTTON
    $("#loadCrew").click(function() {
        loadCrew();
    });


    // Automatically load data when page opens
    $(document).ready(function() {
        loadCrew();
    });

</script>

</body>
</html>
